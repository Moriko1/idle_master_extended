name: Windows build and portable package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, regression tests, and package
        run: python scripts/build.py --package --version 1.12.0-preview.4
      - uses: actions/upload-artifact@v4
        with:
          name: IdleMasterExtended-win-x64
          path: dist/*
          if-no-files-found: error
